name: Publish

# Trusted Publishing: PyPI verifies this workflow's identity, so there is no
# API token to store or leak. Configure it once at
# https://pypi.org/manage/project/pytest-querycount/settings/publishing/
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
