name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        sqlalchemy: ["2.0.*", "2.1.*"]
    name: py${{ matrix.python-version }} / sqlalchemy ${{ matrix.sqlalchemy }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: querycount
          POSTGRES_DB: querycount
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "sqlalchemy[asyncio]==${{ matrix.sqlalchemy }}"
      - name: Test
        # Without REQUIRE_PG the plan tests would skip on a broken service and
        # the build would still be green, which is the worst outcome.
        env:
          QUERYCOUNT_REQUIRE_PG: "1"
          QUERYCOUNT_TEST_PG_URL: postgresql+psycopg://postgres:querycount@localhost:55432/querycount
        run: python -m pytest tests/ -v

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Format
        run: ruff format --check src tests
      - name: Types
        run: mypy

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - name: Check metadata
        run: python -m twine check --strict dist/*
